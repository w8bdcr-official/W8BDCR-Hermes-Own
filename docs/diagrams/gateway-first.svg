<svg width="1200" height="330" viewBox="0 0 1200 330" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Gateway first, then chat — the one rule">
<title>Gateway first, then chat — the one rule</title>
<rect width="1200" height="330" rx="16" fill="#0b1220"/>
<text x="40" y="60" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="30" fill="#e5e7eb" text-anchor="start" font-weight="700">The one rule: gateway first, then chat</text>
<rect x="40" y="92" width="350" height="130" rx="12" fill="#111827" stroke="#22c55e" stroke-width="2"/>
<circle cx="74" cy="132" r="20" fill="#22c55e"/>
<text x="74" y="140" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="22" fill="#052e12" text-anchor="middle" font-weight="700">1</text>
<text x="106" y="140" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="22" fill="#e5e7eb" text-anchor="start" font-weight="700">Start the gateway</text>
<text x="64" y="192" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="18" fill="#94a3b8" text-anchor="start">hermes gateway run … &amp;</text>
<text x="402" y="165" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="34" fill="#22c55e" text-anchor="start" font-weight="700">→</text>
<rect x="420" y="92" width="350" height="130" rx="12" fill="#111827" stroke="#38bdf8" stroke-width="2"/>
<circle cx="454" cy="132" r="20" fill="#38bdf8"/>
<text x="454" y="140" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="22" fill="#052e12" text-anchor="middle" font-weight="700">2</text>
<text x="486" y="140" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="22" fill="#e5e7eb" text-anchor="start" font-weight="700">Start the agent</text>
<text x="444" y="192" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="18" fill="#94a3b8" text-anchor="start">hermes</text>
<text x="782" y="165" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="34" fill="#22c55e" text-anchor="start" font-weight="700">→</text>
<rect x="800" y="92" width="350" height="130" rx="12" fill="#111827" stroke="#f59e0b" stroke-width="2"/>
<circle cx="834" cy="132" r="20" fill="#f59e0b"/>
<text x="834" y="140" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="22" fill="#052e12" text-anchor="middle" font-weight="700">3</text>
<text x="866" y="140" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="22" fill="#e5e7eb" text-anchor="start" font-weight="700">Your provider answers</text>
<text x="824" y="192" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="18" fill="#94a3b8" text-anchor="start">OpenRouter :free — verified</text>
<rect x="40" y="248" width="1120" height="52" rx="12" fill="#2a1215" stroke="#ef4444" stroke-width="2"/>
<text x="64" y="282" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="21" fill="#fca5a5" text-anchor="start">Skip step 1 and bare `hermes` fails:  Gateway connection failed; no local fallback.</text>
</svg>
