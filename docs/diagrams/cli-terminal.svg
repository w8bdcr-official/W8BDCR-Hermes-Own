<svg width="1200" height="460" viewBox="0 0 1200 460" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="The whole CLI — five commands">
<title>The whole CLI — five commands</title>
<rect width="1200" height="460" rx="16" fill="#0b1220"/>
<rect x="24" y="24" width="1152" height="412" rx="12" fill="#111827"/>
<rect x="24" y="24" width="1152" height="52" rx="12" fill="#1f2937"/>
<circle cx="52" cy="50" r="8" fill="#ef4444"/>
<circle cx="80" cy="50" r="8" fill="#f59e0b"/>
<circle cx="108" cy="50" r="8" fill="#22c55e"/>
<text x="160" y="57" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="22" fill="#94a3b8" text-anchor="start">Termux — Ubuntu — hermes</text>
<text x="56" y="130" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="22" fill="#22c55e" text-anchor="start">$ hermes setup</text>
<text x="56" y="160" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="19" fill="#94a3b8" text-anchor="start"># first-time setup</text>
<text x="56" y="192" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="22" fill="#22c55e" text-anchor="start">$ hermes gateway run &gt; /tmp/gateway.log 2&gt;&amp;1 &amp;</text>
<text x="56" y="222" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="19" fill="#94a3b8" text-anchor="start"># gateway first</text>
<text x="56" y="254" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="22" fill="#22c55e" text-anchor="start">$ hermes</text>
<text x="56" y="284" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="19" fill="#94a3b8" text-anchor="start"># start chatting</text>
<text x="56" y="316" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="22" fill="#38bdf8" text-anchor="start">$ hermes chat -q "Hello"</text>
<text x="56" y="346" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="19" fill="#94a3b8" text-anchor="start"># one question, no chat loop</text>
<text x="56" y="378" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="22" fill="#38bdf8" text-anchor="start">$ hermes setup model</text>
<text x="56" y="408" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" font-size="19" fill="#94a3b8" text-anchor="start"># switch provider or model</text>
</svg>
