<svg width="1200" height="400" viewBox="0 0 1200 400" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Three fallbacks, built in">
<title>Three fallbacks, built in</title>
<rect width="1200" height="400" rx="16" fill="#0b1220"/>
<text x="40" y="62" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="30" fill="#e5e7eb" text-anchor="start" font-weight="700">Three fallbacks, built in</text>
<rect x="40" y="96" width="1120" height="76" rx="12" fill="#111827" stroke="#22c55e" stroke-width="2"/>
<circle cx="84" cy="134" r="22" fill="#22c55e"/>
<text x="84" y="142" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="22" fill="#052e12" text-anchor="middle" font-weight="700">1</text>
<text x="124" y="129" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="24" fill="#e5e7eb" text-anchor="start" font-weight="700">Gateway down</text>
<text x="124" y="158" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="20" fill="#94a3b8" text-anchor="start">Restart it — Step 3, then chat again.</text>
<rect x="40" y="192" width="1120" height="76" rx="12" fill="#111827" stroke="#38bdf8" stroke-width="2"/>
<circle cx="84" cy="230" r="22" fill="#38bdf8"/>
<text x="84" y="238" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="22" fill="#052e12" text-anchor="middle" font-weight="700">2</text>
<text x="124" y="225" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="24" fill="#e5e7eb" text-anchor="start" font-weight="700">Provider blocked</text>
<text x="124" y="254" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="20" fill="#94a3b8" text-anchor="start">Switch provider — Step 5, pick another key.</text>
<rect x="40" y="288" width="1120" height="76" rx="12" fill="#111827" stroke="#f59e0b" stroke-width="2"/>
<circle cx="84" cy="326" r="22" fill="#f59e0b"/>
<text x="84" y="334" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="22" fill="#052e12" text-anchor="middle" font-weight="700">3</text>
<text x="124" y="321" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="24" fill="#e5e7eb" text-anchor="start" font-weight="700">Session lost</text>
<text x="124" y="350" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="20" fill="#94a3b8" text-anchor="start">Log back in — Step 6. Nothing is lost.</text>
</svg>
